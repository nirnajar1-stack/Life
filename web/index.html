<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="אפליקציה אישית לניהול משימות והוצאות">
  <meta name="theme-color" content="#1D4ED8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ניהול החיים">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ניהול החיים</title>
  <link rel="manifest" href="manifest.json">
  <script src="push.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F3F5F9;
      color: #0F172A;
      font-family: Heebo, Arial, sans-serif;
    }
    .boot {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .boot-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #1D4ED8;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
    }
    .boot-title {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }
    .boot-sub {
      margin: 0;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="boot">
    <div class="boot-mark">ח</div>
    <p class="boot-title">ניהול החיים</p>
    <p class="boot-sub">טוען משימות והוצאות…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
